[package]
name = "app"
version = "0.1.0"
description = "Yen Hub"
authors = ["Yen"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
thiserror = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-notification = "2"

# macOS-only: native Touch ID via LocalAuthentication.framework.
# See: ADR 0001 §Implementation, Slice 2.5c
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "block2"] }
block2 = "0.6"
